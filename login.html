<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Voltage Premium Electronics</title>
  <meta name="description" content="Sign in to your Voltage account to access your orders, wishlist, and exclusive member discounts.">
  <link rel="canonical" href="https://www.voltage-store.example/login.html">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231565C0'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8Z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/auth.css">

  <script>
    (function(){
      try{
        var theme = localStorage.getItem('voltage-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if(theme === 'dark' || (!theme && prefersDark)){ document.documentElement.classList.add('dark'); }
        var dir = localStorage.getItem('voltage-dir');
        if(dir === 'rtl'){ document.documentElement.setAttribute('dir','rtl'); }
      }catch(e){}
    })();
  </script>
</head>
<body>
  <div class="auth-page">
    <!-- Top actions for controls -->
    <div class="auth-top-actions">
      <a href="index.html" class="icon-btn" aria-label="Back to store" title="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <button class="icon-btn rtl-toggle" id="rtlToggle" aria-label="Toggle right-to-left layout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/></svg>
      </button>
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        <span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
      </button>
    </div>

    <!-- Central Floating Card -->
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo-badge" aria-label="Voltage Home">
          <span class="brand-logo__mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
          </span>
          <span class="brand-logo__text">Volt<span style="color:var(--c-primary)">age</span></span>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your Voltage account</p>
      </div>

      <form class="auth-form" id="loginForm" onsubmit="event.preventDefault(); alert('Signed in successfully!'); window.location.href='index.html';">
        <div class="auth-field">
          <label for="emailInput">Email Address</label>
          <div class="auth-input-group">
            <input type="email" id="emailInput" class="auth-input" placeholder="you@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <label for="passwordInput">Password</label>
          <div class="auth-input-group">
            <input type="password" id="passwordInput" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="auth-checkbox-label">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link" onclick="alert('Password reset link sent to your email.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="btn-auth-submit">Sign In</button>
      </form>

      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <!-- Vertically Stacked Social Auth Buttons -->
      <div class="auth-social-list">
        <button type="button" class="btn-social" onclick="alert('Continuing with Google...'); window.location.href='index.html';">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button type="button" class="btn-social" onclick="alert('Continuing with Apple...'); window.location.href='index.html';">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.13c.66-.82 1.12-1.96.99-3.13-1 .04-2.21.67-2.9 1.48-.61.72-1.14 1.88-1 3.02 1.12.09 2.25-.55 2.91-1.37z"/>
          </svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div class="auth-footer-text">
        Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var passInput = document.getElementById('passwordInput');
      var toggleBtn = document.getElementById('togglePasswordBtn');
      var eyeIcon = document.getElementById('eyeIcon');

      toggleBtn.addEventListener('click', function() {
        var isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        eyeIcon.innerHTML = isPass 
          ? '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>'
          : '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      });
    });
  </script>
</body>
</html>
